# Infrastructure only. The control plane and the portal run on the host —
# `npm run dev` — because provisioning drives the local Docker daemon and the
# whole point of the dev fleet is watching it do that.
#
#   docker compose up -d
#
# Ports are offset from PretzelGraph's stack so both can run at once: the dev
# fleet provisions PretzelGraph containers, and you may well have its own
# compose up beside it.

name: pretzel-cloud

services:

  # The control plane's own databases and the issuer's. No workspace database is
  # ever created here — those go on the clusters below.
  postgres-cloud:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pretzel}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      GOTRUE_DB_NAME: ${GOTRUE_DB_NAME:-gotrue}
      PORTAL_SERVICE_PASSWORD: ${PORTAL_SERVICE_PASSWORD:-service}
      PORTAL_APP_PASSWORD: ${PORTAL_APP_PASSWORD:-app}
      FLEET_SERVICE_PASSWORD: ${FLEET_SERVICE_PASSWORD:-service}
    ports:
      - "${POSTGRES_CLOUD_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Workspace clusters: nothing but workspace databases, created on demand. Each
  # needs a row in `clusters` and a CLUSTER_ADMIN_URL_<NAME> to be placed on.
  postgres-alpha:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pretzel}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_ALPHA_PORT:-5434}:5432"
    volumes:
      - postgres-alpha-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-beta:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pretzel}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_BETA_PORT:-5435}:5432"
    volumes:
      - postgres-beta-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The fleet issuer, shared by every workspace. A workspace never runs its own.
  gotrue:
    image: supabase/auth:v2.177.0
    restart: unless-stopped
    depends_on:
      postgres-cloud:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: 9999
      # What a browser is told to use. Containers reach it at http://gotrue:9999.
      API_EXTERNAL_URL: ${GOTRUE_EXTERNAL_URL:-http://localhost:9998}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-pretzel}@postgres-cloud:5432/${GOTRUE_DB_NAME:-gotrue}?sslmode=disable&search_path=auth

      GOTRUE_SITE_URL: ${PORTAL_URL:-http://localhost:5174}
      GOTRUE_URI_ALLOW_LIST: ${GOTRUE_URI_ALLOW_LIST:-http://localhost:5174}
      GOTRUE_DISABLE_SIGNUP: "false"

      # Every workspace verifies against this same secret, so it is fleet-wide.
      GOTRUE_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated

      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
    ports:
      - "${GOTRUE_PORT:-9998}:9999"

  # Pub/sub and shared state for the control plane (realtime fan-out, and the
  # cross-instance locks and rate limits that follow).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "${CONTROL_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # A browser over the cluster. Not pinned to one database: every workspace has
  # its own, so the connection is chosen on the page.
  pgweb:
    image: sosedoff/pgweb:latest
    restart: unless-stopped
    depends_on:
      postgres-cloud:
        condition: service_healthy
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-pretzel}@postgres-cloud:5432/portal?sslmode=disable
    ports:
      - "${PGWEB_PORT:-8081}:8081"

volumes:
  postgres-data:
  postgres-alpha-data:
  postgres-beta-data:

# Named explicitly: provisioned workspace containers are attached to this so they
# can reach Postgres and the issuer by service name.
networks:
  default:
    name: ${FLEET_INFRA_NETWORK:-pretzel-cloud}
