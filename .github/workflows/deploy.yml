# Deploys the control plane: on a merge into the release branch — which the
# ruleset makes a deliberate act — or from the Deploy button for a re-deploy
# without a commit. Builds from the checked-out branch, so what ships is
# what is committed.
name: deploy

on:
  push:
    branches: [latest]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-control-plane
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy the control plane
        run: flyctl deploy --config fly.toml --app pretzel-control-plane --remote-only --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
